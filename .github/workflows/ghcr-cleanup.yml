name: Cleanup old GHCR sha tags

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      keep_per_package:
        description: 'Number of newest sha-* only versions to keep per wordpress-* package'
        required: false
        default: '5'

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      KEEP_PER_PACKAGE: ${{ github.event.inputs.keep_per_package || '5' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete old sha-only package versions
        run: |
          keep="$KEEP_PER_PACKAGE"
          if [[ ! "$keep" =~ ^[0-9]+$ ]]; then
            echo "error: keep_per_package must be a non-negative integer (received '$keep')" >&2
            exit 1
          fi

          scope='users'
          if gh api "/orgs/$OWNER" >/dev/null 2>&1; then
            scope='orgs'
          fi

          mapfile -t packages < <(
            gh api --paginate "/$scope/$OWNER/packages?package_type=container&per_page=100" \
              | jq -r '.[] | select(.name | startswith("wordpress-")) | .name' \
              | sort -u
          )

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No wordpress-* container packages found for $OWNER."
            exit 0
          fi

          for package in "${packages[@]}"; do
            echo "Processing package: $package"

            mapfile -t delete_ids < <(
              gh api --paginate "/$scope/$OWNER/packages/container/$package/versions?per_page=100" \
                | jq -r --argjson keep "$keep" '
                  [ .[]
                    | {
                        id,
                        created_at,
                        tags: (.metadata.container.tags // [])
                      }
                    | select((.tags | length) > 0)
                    | select(all(.tags[]; startswith("sha-")))
                  ]
                  | sort_by(.created_at)
                  | reverse
                  | .[$keep:]
                  | .[].id
                '
            )

            if [[ "${#delete_ids[@]}" -eq 0 ]]; then
              echo "Nothing to delete for $package"
              continue
            fi

            for version_id in "${delete_ids[@]}"; do
              gh api --method DELETE "/$scope/$OWNER/packages/container/$package/versions/$version_id"
              echo "Deleted $package version id $version_id"
            done
          done
