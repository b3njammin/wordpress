name: Update WordPress Versions

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: wordpress-version-updates
  cancel-in-progress: false

jobs:
  update:
    name: Refresh versions and open PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run upstream update automation for supported channels
        run: |
          # Keep the update flow aligned with upstream scripts, but only for channels we allow here.
          ./update.sh latest cli

      - name: Enforce 6.9.x WordPress pin policy (exclude 7.x)
        run: |
          # Policy scope: only stable WordPress updates are automated here ("latest").
          # Non-WordPress channels (for example "cli") and non-stable tracks are intentionally excluded.
          echo 'Validating automated WordPress channel(s) are pinned to 6.9.x.'
          wordpressChannels=(latest)

          if [ "${#wordpressChannels[@]}" -eq 0 ]; then
            echo '::error title=Validation failed::No WordPress channels were found in versions.json.'
            exit 1
          fi

          invalid=0
          for channel in "${wordpressChannels[@]}"; do
            version="$(jq -r --arg channel "$channel" '.[$channel].version // empty' versions.json)"
            if [[ ! "$version" =~ ^6\.9\.[0-9]+$ ]]; then
              echo "::error title=Out-of-policy WordPress version::Channel '$channel' resolved to '$version'. Only 6.9.x is permitted; skipping automated commit/PR."
              invalid=1
            else
              echo "Channel '$channel' is compliant: $version"
            fi
          done

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

      - name: Create pull request for allowed updates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/wordpress-6.9.x-updates
          delete-branch: true
          commit-message: 'Update WordPress 6.9.x versions'
          title: 'Update WordPress 6.9.x versions'
          body: |
            This update automation remains aligned with upstream script behavior while enforcing a workflow-level policy to keep WordPress channels pinned to `6.9.x` only.

            Why policy enforcement is in workflow:
            - `versions.sh` fetch behavior is preserved.
            - Workflow validation blocks commits/PRs when any WordPress channel resolves outside `^6\.9\.[0-9]+$` (including `7.x`).
            - Non-WordPress channels like `cli` are excluded from this policy check.
